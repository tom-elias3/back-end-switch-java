plugins {
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'application'
}

group = 'com.tom.backendswitch'
version = '0.0.1-SNAPSHOT'

ext['lombok.version'] = '1.18.40'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

application {
	// Replace with your main class fully qualified name
	mainClass = 'com.tom.backendswitch.BackEndSwitchApplication'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'loadtest'
	}
}

tasks.register('loadTest', Test) {
	dependsOn dockerBuild
	useJUnitPlatform {
		includeTags 'loadtest'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperties System.properties.findAll { k, v -> k in ['threads', 'durationSeconds'] }
}

tasks.register('dockerBuild', Exec) {
	dependsOn bootJar
	commandLine 'docker', 'build', '-t', 'backendswitch', '.'
}